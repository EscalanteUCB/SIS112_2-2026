<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora UCB</title>
    <style>
        :root {
            --ucb-blue: #002B49;
            --ucb-gold: #D4A017;
            --ucb-bg: #F4F6F8;
            --ucb-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--ucb-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--ucb-white);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 43, 73, 0.15);
            width: 100%;
            max-width: 380px;
            overflow: hidden;
            border-top: 6px solid var(--ucb-gold);
        }

        .card-header {
            background-color: var(--ucb-blue);
            color: var(--ucb-white);
            padding: 24px 20px;
            text-align: center;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--ucb-blue);
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #E2E8F0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--ucb-blue);
        }

        button {
            width: 100%;
            background-color: var(--ucb-blue);
            color: var(--ucb-white);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--ucb-gold);
            color: var(--ucb-blue);
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #EBF3FA;
            border-left: 4px solid var(--ucb-gold);
            border-radius: 4px;
            text-align: center;
        }

        .result-title {
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--ucb-blue);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>Calculadora Suma</h2>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label for="num1">Número A</label>
                <input type="number" id="num1" placeholder="0" oninput="ejecutarSuma()">
            </div>
            <div class="form-group">
                <label for="num2">Número B</label>
                <input type="number" id="num2" placeholder="0" oninput="ejecutarSuma()">
            </div>
            
            <button onclick="ejecutarSuma()">Calcular</button>

            <div class="result-box">
                <div class="result-title">Resultado</div>
                <div class="result-value" id="resultado">0</div>
            </div>
        </div>
    </div>

    <script>
        // Tu función original
        function suma(a, b) {
            return a + b;
        }

        // Controlador de interfaz dinámica
        function ejecutarSuma() {
            const inputA = parseFloat(document.getElementById('num1').value) || 0;
            const inputB = parseFloat(document.getElementById('num2').value) || 0;
            
            const total = suma(inputA, inputB);
            
            document.getElementById('resultado').textContent = total;
        }
    </script>

</body>
</html>
